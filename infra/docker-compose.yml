# Single-instance topology for the distributed rate limiter (M2) + observability (M4).
#
#   client ──▶ gateway:8080 ──(atomic Lua)──▶ redis
#                   └────────(proxy /api/**)──▶ demo-backend:9000
#                   └────────(/actuator/prometheus)──▶ prometheus:9090 ──▶ grafana:3000
#
# App images are built from the per-module Dockerfiles via the docker CLI — build the jars
# first (`mvn -DskipTests package`), then `docker compose up --build` (see infra/README.md).
services:
  redis:
    image: redis:7-alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  demo-backend:
    image: rate-limiter/demo-backend:0.1.0-SNAPSHOT
    build:
      context: ../demo-backend
      dockerfile: Dockerfile
    container_name: rl-demo-backend
    expose:
      - "9000"
    restart: unless-stopped

  gateway:
    image: rate-limiter/gateway-service:0.1.0-SNAPSHOT
    build:
      context: ../gateway-service
      dockerfile: Dockerfile
    container_name: rl-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BACKEND_URI: http://demo-backend:9000
    depends_on:
      redis:
        condition: service_healthy
      demo-backend:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rl-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rl-grafana
    ports:
      - "3000:3000"
    environment:
      # Demo-only credentials; anonymous viewing is on so the dashboard opens with no login.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # M6 — k6 throughput/latency benchmark. Profile-gated so a normal `docker compose up` does
  # NOT start it; run it on demand against the live gateway with:
  #   docker compose --profile bench up k6
  # While it runs, watch the load land in Grafana (http://localhost:3000). Tune via env, e.g.:
  #   VUS=100 DURATION=2m docker compose --profile bench up k6
  k6:
    image: grafana/k6:0.53.0
    container_name: rl-k6
    profiles: ["bench"]
    environment:
      BASE_URL: http://gateway:8080
      API_KEY: bench-key
      VUS: ${VUS:-50}
      DURATION: ${DURATION:-60s}
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/throughput.js"]
    depends_on:
      gateway:
        condition: service_started
    restart: "no"
