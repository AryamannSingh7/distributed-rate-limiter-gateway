name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Linux runners ship with Docker, so Testcontainers starts Redis itself —
      # no service container or REDIS_HOST override required (that is the local
      # Windows/Docker-Desktop workaround only).
      - name: Build & run all tests
        run: mvn -B -ntp verify
